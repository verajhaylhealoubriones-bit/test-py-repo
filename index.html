<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Spreadsheet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Data Spreadsheet</h1>

    <button id="loadUsers">Load Students</button>

    <p id="status"></p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>City</th>
                <th>School</th>
            </tr>
        </thead>

        <tbody id="userList"></tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
